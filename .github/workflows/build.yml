name: Build Kernel Image
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc gcc-aarch64-linux-gnu

    - name: Download Kernel Source
      run: |
        wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.19.191.tar.xz
        tar -xf linux-4.19.191.tar.xz

    - name: Prepare Config
      run: |
        cp .config linux-4.19.191/.config
        cd linux-4.19.191
        make ARCH=arm64 olddefconfig

    - name: Build Image
      run: |
        cd linux-4.19.191
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image-file
        path: linux-4.19.191/arch/arm64/boot/Image

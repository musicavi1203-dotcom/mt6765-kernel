name: Build OverlayFS Exploit
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Download PoC
      run: |
        git clone https://github.com/Xkaguya/CVE-2023-0386.git
        cd CVE-2023-0386

    - name: Compile Exploit
      run: |
        cd CVE-2023-0386
        aarch64-linux-gnu-gcc -static -O2 exploit.c -o exploit_arm64

    - name: Upload Exploit
      uses: actions/upload-artifact@v4
      with:
        name: overlayfs-exploit
        path: CVE-2023-0386/exploit_arm64

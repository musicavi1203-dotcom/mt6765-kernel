name: Build GhostKey APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        sdkmanager --install "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Download GhostKey
      run: |
        git clone https://github.com/Again1996-bit/CVE-2026-98260-GhostKey.git
        cd CVE-2026-98260-GhostKey

    - name: Build APK
      run: |
        cd CVE-2026-98260-GhostKey
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GhostKey-apk
        path: CVE-2026-98260-GhostKey/app/build/outputs/apk/release/*.apk

name: Build OverlayFS Exploit
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Download PoC
      run: |
        git clone https://github.com/sxlmnwb/CVE-2023-0386.git

    - name: Compile Exploit in ARM64 Container
      run: |
        docker run --rm -v $(pwd):/src -w /src arm64v8/ubuntu:22.04 /bin/bash -c "
          apt-get update
          apt-get install -y build-essential libfuse-dev libcap-dev
          cd CVE-2023-0386
          make all
        "

    - name: Upload Exploit
      uses: actions/upload-artifact@v4
      with:
        name: overlayfs-exploit
        path: |
          CVE-2023-0386/fuse
          CVE-2023-0386/exp
          CVE-2023-0386/gc

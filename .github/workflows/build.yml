name: Build CVE-2023-20938 PoC
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install cross-compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Download PoC
      run: |
        git clone https://github.com/byt3quester/CVE-2023-20938-poc.git
        cd CVE-2023-20938-poc

    - name: Compile PoC
      run: |
        cd CVE-2023-20938-poc
        aarch64-linux-gnu-gcc -static -O2 -o exploit exploit.c

    - name: Upload Exploit
      uses: actions/upload-artifact@v4
      with:
        name: cve-2023-20938-exploit
        path: CVE-2023-20938-poc/exploit

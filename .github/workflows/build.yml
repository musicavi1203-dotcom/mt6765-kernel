name: Build Perf Bypass Hook
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install cross-compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Create Hook Source
      run: |
        cat << 'EOF' > hook.c
        #define _GNU_SOURCE
        #include <dlfcn.h>
        #include <linux/perf_event.h>
        #include <sys/syscall.h>
        #include <unistd.h>

        long perf_event_open(struct perf_event_attr *hw_event, pid_t pid, int cpu, int group_fd, unsigned long flags) {
            // Force exclude_kernel = 1 to bypass perf_event_paranoid
            hw_event->exclude_kernel = 1;
            return syscall(__NR_perf_event_open, hw_event, pid, cpu, group_fd, flags);
        }
        EOF

    - name: Compile Hook
      run: |
        aarch64-linux-gnu-gcc -shared -fPIC -o hook.so hook.c -ldl

    - name: Upload Hook
      uses: actions/upload-artifact@v4
      with:
        name: perf-bypass-hook
        path: hook.so

name: Build extract_rs for Android
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cross
      run: cargo install cross

    - name: Clone GhostLock Repo
      run: |
        git clone https://github.com/YuKongA/ghostlock-app.git

    - name: Patch Version Check
      run: |
        cd ghostlock-app/tools/extract_rs
        # מוחק את כל השורה שמכילה את השגיאה
        sed -i '/needs a 5.x\/6.x release/d' src/main.rs

    - name: Build Binary
      run: |
        cd ghostlock-app/tools/extract_rs
        cross build --release --target aarch64-unknown-linux-musl

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: extract_rs-binary
        path: ghostlock-app/tools/extract_rs/target/aarch64-unknown-linux-musl/release/extract_rs

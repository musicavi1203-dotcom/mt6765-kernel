name: Build GhostKey APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK packages
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          'platforms;android-35' \
          'build-tools;35.0.0' \
          'ndk;26.1.10909125'

    - name: Download GhostKey
      run: |
        git clone https://github.com/Again1996-bit/CVE-2026-98260-GhostKey.git
        cd CVE-2026-98260-GhostKey

    - name: Generate Keystore & Set Passwords
      run: |
        cd CVE-2026-98260-GhostKey
        mkdir -p app/keystore
        keytool -genkeypair -v -keystore app/keystore/release.keystore -alias cve98260 -keyalg RSA -keysize 2048 -validity 10000 -storepass ghostkey123 -keypass ghostkey123 -dname "CN=GhostKey, OU=Security, O=Research, L=Unknown, S=Unknown, C=US"
        
        # Inject passwords into local.properties
        echo "CVE98260_STORE_PASSWORD=ghostkey123" >> local.properties
        echo "CVE98260_KEY_PASSWORD=ghostkey123" >> local.properties

    - name: Build APK
      run: |
        cd CVE-2026-98260-GhostKey
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GhostKey-apk
        path: CVE-2026-98260-GhostKey/app/build/outputs/apk/release/*.apk

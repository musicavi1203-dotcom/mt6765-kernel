name: Build Kernel vmlinux
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc gcc-aarch64-linux-gnu

    - name: Download Kernel Source
      run: |
        wget https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.19.191.tar.xz
        tar -xf linux-4.19.191.tar.xz

    - name: Prepare Config
      run: |
        cp .config linux-4.19.191/.config
        cd linux-4.19.191
        # מנקה הגדרות שלא קיימות בלינוקס רגיל כדי שלא יקרוס
        make ARCH=arm64 olddefconfig

    - name: Build vmlinux
      run: |
        cd linux-4.19.191
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) vmlinux

    - name: Upload vmlinux
      uses: actions/upload-artifact@v3
      with:
        name: vmlinux-file
        path: linux-4.19.191/vmlinux

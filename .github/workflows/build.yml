name: Build extract_rs for Android
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cross
      run: cargo install cross

    - name: Clone GhostLock Repo
      run: |
        git clone https://github.com/YuKongA/ghostlock-app.git

    - name: Patch Version Check & Vulnerability Check
      run: |
        cd ghostlock-app/tools/extract_rs
        # מבטל את בדיקת הגרסה
        sed -i 's/needs a 5.x\/6.x release, got {release_text}/bypassed/' src/main.rs
        # מבטל את בדיקת ה-UAF
        sed -i 's/if remove_waiter_uses_current(&dis)/if true/' src/derive.rs
        sed -i 's/if remove_waiter_uses_current(&dis) {/if true {/' src/derive.rs

    - name: Build Binary
      run: |
        cd ghostlock-app/tools/extract_rs
        cross build --release --target aarch64-unknown-linux-musl

    - name: Find and Copy Binary
      run: |
        find ghostlock-app -type f -name "ghostlock-extract" -exec cp {} ./extract_rs_android \;
        ls -la ./extract_rs_android

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: extract_rs-binary
        path: extract_rs_android

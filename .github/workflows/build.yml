name: Build CVE-2026-98937 PoC
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install cross-compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Download PoC
      run: |
        git clone https://github.com/woshigenm/CVE-2026-98937.git
        cd CVE-2026-98937

    - name: Compile PoC
      run: |
        cd CVE-2026-98937
        aarch64-linux-gnu-gcc -static -O2 -o poc src/poc.c

    - name: Upload PoC
      uses: actions/upload-artifact@v4
      with:
        name: cve-2026-98937-poc
        path: CVE-2026-98937/poc

name: Build Patched GhostLock
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu patchelf

    - name: Create Syscall Hook
      run: |
        cat << 'EOF' > hook.c
        #define _GNU_SOURCE
        #include <dlfcn.h>
        #include <stdarg.h>
        #include <unistd.h>
        #include <sys/syscall.h>
        #include <linux/perf_event.h>

        long syscall(long number, ...) {
            va_list args;
            va_start(args, number);
            long a1 = va_arg(args, long);
            long a2 = va_arg(args, long);
            long a3 = va_arg(args, long);
            long a4 = va_arg(args, long);
            long a5 = va_arg(args, long);
            long a6 = va_arg(args, long);
            va_end(args);

            if (number == __NR_perf_event_open) {
                struct perf_event_attr *hw_event = (struct perf_event_attr *)a1;
                if (hw_event) {
                    hw_event->exclude_kernel = 1;
                }
            }

            long (*real_syscall)(long, ...) = dlsym(RTLD_NEXT, "syscall");
            return real_syscall(number, a1, a2, a3, a4, a5, a6);
        }
        EOF

    - name: Compile Hook
      run: |
        aarch64-linux-gnu-gcc -shared -fPIC -o hook.so hook.c -ldl

    - name: Patch GhostLock
      run: |
        patchelf --add-needed /data/local/tmp/hook.so ghostlock

    - name: Upload Patched Binary
      uses: actions/upload-artifact@v4
      with:
        name: patched-ghostlock
        path: |
          ghostlock
          hook.so

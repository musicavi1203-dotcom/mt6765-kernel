name: Build extract_rs for Android
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-unknown-linux-musl

    - name: Install musl cross toolchain
      run: |
        wget https://musl.cc/aarch64-linux-musl-cross.tgz
        tar -xzf aarch64-linux-musl-cross.tgz
        echo "$PWD/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

    - name: Clone GhostLock Repo
      run: |
        git clone https://github.com/YuKongA/ghostlock-app.git

    - name: Patch Version Check
      run: |
        cd ghostlock-app/tools/extract_rs
        sed -i '611s/^/\/\//' src/main.rs

    - name: Build Binary
      run: |
        cd ghostlock-app/tools/extract_rs
        cargo build --release --target aarch64-unknown-linux-musl
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: extract_rs-binary
        path: ghostlock-app/tools/extract_rs/target/aarch64-unknown-linux-musl/release/extract_rs
